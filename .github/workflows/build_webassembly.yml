name: Build Project - WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_webassembly.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/build_webassembly.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Setup Environment
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Build Product
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}
        nix-shell --command "make build PLATFORM=Web BUILD_TYPE=Release"
      shell: bash
